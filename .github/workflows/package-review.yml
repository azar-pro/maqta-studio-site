name: Package MAQTA review

on:
  push:
    branches: [site-polish-2026-09]
    paths:
      - 'tools/package_review_trigger.txt'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site-polish-2026-09
      - name: Create clean review archive
        run: |
          mkdir -p /tmp/maqta-review
          rsync -a ./ /tmp/maqta-review/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'tools/'
          cd /tmp
          zip -qr maqta-review-source.zip maqta-review
      - uses: actions/upload-artifact@v4
        with:
          name: maqta-review-source
          path: /tmp/maqta-review-source.zip
          if-no-files-found: error
