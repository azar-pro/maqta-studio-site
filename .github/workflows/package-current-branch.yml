name: Package current MAQTA branch
on:
  push:
    branches: [site-polish-2026-09]
    paths:
      - 'tools/package-current-trigger.txt'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site-polish-2026-09
      - name: Package source
        run: |
          mkdir -p /tmp/current
          rsync -a ./ /tmp/current/ --exclude '.git/' --exclude '.github/' --exclude 'tools/'
          cd /tmp
          zip -qr maqta-current-branch.zip current
      - uses: actions/upload-artifact@v4
        with:
          name: maqta-current-branch
          path: /tmp/maqta-current-branch.zip
          if-no-files-found: error
