name: Add MAQTA Street Address

on:
  push:
    branches: [seo-local-2026-09]
    paths:
      - 'tools/add_street_address.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-local-2026-09
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/add_street_address.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fr/index.html en/index.html ar/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add Rue Bizerte to MAQTA LocalBusiness schema"
            git push origin HEAD:seo-local-2026-09
          fi
