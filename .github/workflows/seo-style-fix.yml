name: Preserve MAQTA Portfolio Styling

on:
  push:
    branches:
      - seo-local-2026-09
    paths:
      - 'tools/seo_style_fix.py'
      - '.github/workflows/seo-style-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  style-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-local-2026-09
          fetch-depth: 0
      - run: python tools/seo_style_fix.py
      - name: Commit CSS compatibility rule
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/site.css
          if git diff --cached --quiet; then
            echo "No CSS change needed."
          else
            git commit -m "Preserve portfolio styling after semantic SEO cleanup"
            git push origin seo-local-2026-09
          fi
